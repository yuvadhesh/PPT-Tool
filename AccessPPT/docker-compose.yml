version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: accessppt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-accessppt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accessppt}
      POSTGRES_DB: ${POSTGRES_DB:-accessppt}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessppt"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: accessppt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: accessppt-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accessppt-backend
    restart: unless-stopped
    environment:
      - APP_NAME=AccessPPT
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://accessppt:accessppt@postgres:5432/accessppt
      - DATABASE_SYNC_URL=postgresql://accessppt:accessppt@postgres:5432/accessppt
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=accessppt
      - S3_USE_SSL=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-pro}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key-in-production-long}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-key-in-production-long}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media_storage

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: accessppt-celery
    restart: unless-stopped
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - APP_NAME=AccessPPT
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://accessppt:accessppt@postgres:5432/accessppt
      - DATABASE_SYNC_URL=postgresql://accessppt:accessppt@postgres:5432/accessppt
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=accessppt
      - S3_USE_SSL=false
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-pro}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_media:/app/media_storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: accessppt-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: accessppt-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backend_media:
